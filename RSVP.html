<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Invitation</title>
    <style>
        /* 简单的样式设置 */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f5f0; /* beige */
            color: #5a5a5a;
            text-align: center;
        }
        .container {
            max-width: 600px; /* 限制宽度，模拟手机效果 */
            margin: 0 auto;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .header {
            padding: 40px 20px;
            background-color: #fff0f3; /* 淡粉色头图背景 */
        }
        h1 {
            color: #d48888;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .date-loc {
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .hero-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .content {
            padding: 30px 20px;
            line-height: 1.8;
        }
        .photo-grid {
            padding: 10px;
        }
        .photo-grid img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .footer {
            padding: 20px;
            font-size: 0.9em;
            color: #999;
            background-color: #f9f5f0;
        }
        .btn {
            display: inline-block;
            padding: 10px 30px;
            background-color: #d48888;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Kelvin & Hesther</h1>
        <p>We are getting married & 我们要结婚了</p>
    </div>

    <img src="main_photo.jpg" alt="Main Wedding Photo" class="hero-img">

    <div class="content">
        <div class="date-loc">
            <p><strong>Date :</strong> 2026 . 7 . 4</p>
            <p><strong>Time :</strong> 17:00 ~ </p>
            <p><strong>Venue :</strong> 대전 중구 서문로 133, 4F 아스틴홀 </p>
        </div>

        <p>
            在这个特别的日子里，<br>
            我们需要您的祝福与见证。<br>
            诚挚邀请您参加我们的婚礼！
        </p>
        <p>
            이 특별한 날,<br>
            여러분의 따뜻한 축복과 증인이 되어 주시길 바랍니다.<br>
            저희 결혼식에 정중히 초대합니다.
        </p>

        <div class="photo-grid">
            <img src="photo1.jpg" alt="Photo 1">
            <img src="photo2.jpg" alt="Photo 2">
            <img src="photo3.jpg" alt="Photo 3">
        </div>

        <a href="#" class="btn">查看地图导航</a>
    </div>

    <div class="footer">
        <p>期待您的光临！</p>
    </div>
</div>

</body>

</html>
